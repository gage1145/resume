name: Check ATS Optimization

on:
  push:
    paths:
      - "resume.qmd"
      - "resume.cls"
      - "resume.lua"
      - "resume.css"
      - "template.tex"
      - "_quarto.yml"
      - ".github/workflows/ats-compliance.yml"
  pull_request:
    paths:
      - "resume.qmd"
      - "resume.cls"
      - "resume.lua"
      - "resume.css"
      - "template.tex"
      - "_quarto.yml"
      - ".github/workflows/ats-compliance.yml"

jobs:
  build-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Renders both formats, so a break in the filter's HTML branch is caught
      # here too, not just the LaTeX one.
      - name: Render resume
        run: quarto render

      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Extract text from PDF
        run: pdftotext resume.pdf resume.txt

      - name: Check if PDF is selectable
        run: |
          if [ ! -s resume.txt ]; then
            echo "::error::The PDF contains no selectable text (potential ATS issue)."
            exit 1
          fi

      - name: Validate ATS keywords
        run: |
          REQUIRED_KEYWORDS=("R" "Python" "SQL" "AWS" "Django" "Data visualization" "GitHub" "CI/CD")
          MISSING=()
          for keyword in "${REQUIRED_KEYWORDS[@]}"; do
            # Case-insensitive, but bounded so a bare "R" doesn't match every
            # word containing the letter.
            if ! grep -qiE "(^|[^[:alnum:]])${keyword}([^[:alnum:]]|$)" resume.txt; then
              MISSING+=("$keyword")
            fi
          done
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::Missing required ATS keywords: ${MISSING[*]}"
            exit 1
          fi
          echo "All required keywords present."

      - name: Upload rendered resume
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: |
            resume.pdf
            resume.html
